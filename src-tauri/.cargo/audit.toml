# cargo-audit config for the Tauri crate (discovered as src-tauri/.cargo/audit.toml
# when CI runs cargo-audit with working-directory: src-tauri).
#
# glib 0.18.5 is transitive via gtk 0.18.2 → tauri 2.11.5 (Linux-only).
# Vulnerability: RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g — VariantStrIter unsoundness
# Vulnerable range: >=0.15.0, <0.20.0 ; fixed in 0.20.0 (breaking, blocked by GTK 0.18)
# Tracking: Dependabot alert #21 dismissed (tolerable_risk) until Tauri GTK 0.20 bump.
# CI: `Dependency audit` runs `cargo audit` here (see .github/workflows/ci.yml).
# To verify locally: cargo install cargo-audit && cargo audit (from src-tauri)
#
# Time-bound exceptions live in audit-exceptions.toml; CI enforces expires dates.

[advisories]
ignore = ["RUSTSEC-2024-0429"]
