# security.yml — slow-lane SAST and deep secret history scan.
# Semgrep gates PRs; TruffleHog runs weekly (advisory).

name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: OWASP + Python + JavaScript rulesets
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/python \
            --config=p/javascript \
            --error \
            --exclude='tmp/' \
            --exclude='.context/' \
            --exclude='backups/' \
            hooks/scripts ci/scripts tests scaffolds

  trufflehog:
    name: Secret history — TruffleHog
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
        continue-on-error: true
