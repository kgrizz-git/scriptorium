# ci.yml — fast-lane required checks for Scriptorium.
# Target: under ~5 minutes on a cold runner.
# Slow lane (Semgrep schedule): .github/workflows/security.yml
# Action refs are pinned to full commit SHAs; trailing comments keep Dependabot updates working.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy (file size, docs, backlog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: File size & counts (all tracked files)
        run: |
          git ls-files -z | xargs -0 python hooks/scripts/check_file_size.py

      - name: Living backlog size
        run: python hooks/scripts/check_todo_limits.py to_do.md

      - name: Backlog ↔ plans sync (advisory)
        run: python hooks/scripts/check_todo_plan_sync.py to_do.md || true

      - name: Internal documentation links
        run: python ci/scripts/check_doc_links.py --internal-only --strict

      - name: Doc freshness (advisory on PR)
        if: github.event_name == 'pull_request'
        env:
          POLICY_WARN_AS_ERROR: "0"
        run: |
          git ls-files '*.md' | xargs -r python hooks/scripts/check_doc_freshness.py || true

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Ruff lint (incl. complexity)
        run: |
          pip install ruff==0.11.13
          ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "hooks/scripts scripts"
          severity: warning

      - name: Markdownlint (maintained docs)
        run: >-
          npx --yes markdownlint-cli2@0.23.0
          "AGENTS.md" "README.md" "CHANGELOG.md" "CHANGELOG.dev.md" "to_do.md"
          "ci/**/*.md" "hooks/**/*.md" "inventory/**/*.md" "policies/**/*.md"
          "prompts/**/*.md" "templates/**/*.md" "plans/**/*.md" "docs/**/*.md"

      - name: Actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: .github/workflows/*.yml

      - name: Python policy scripts compile
        run: python -m compileall -q hooks/scripts ci/scripts tests

  typecheck:
    name: Type check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: basedpyright
        run: |
          pip install basedpyright==1.29.4
          basedpyright

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: pytest + coverage gate
        run: |
          pip install pytest pytest-cov
          pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: gitleaks detect (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          mkdir -p /tmp/gitleaks && tar xzf "/tmp/${tarball}" -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks detect --redact --no-banner --exit-code 1 --verbose
